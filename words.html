<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb6c1">
<title>🐱 咩咩背单词 · CET-6 冲刺</title>
<style>
  :root{
    --pink:#ffb6c1; --pink-d:#ff8fab; --pink-l:#ffe3ea; --pink-bg:#fff0f3;
    --red:#ff5c7a; --ink:#5a3d44; --ink-l:#9a7a82; --white:#fff;
    --gold:#ffb830; --green:#7ed6a5; --shadow:0 4px 14px rgba(255,140,160,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#ffe0e8 0%,#fff4f6 40%,#ffeaf0 100%);
    color:var(--ink); min-height:100vh; padding-bottom:86px; overflow-x:hidden;
  }
  button{font-family:inherit;border:none;cursor:pointer;}
  /* ===== 顶部 ===== */
  .topbar{
    display:flex;align-items:center;gap:8px;padding:12px 14px 4px;
  }
  .topbar h1{font-size:19px;color:var(--ink);flex:1;}
  .streak{
    background:#fff;border-radius:20px;padding:4px 12px;font-size:13px;
    color:var(--red);box-shadow:var(--shadow);font-weight:bold;
  }
  /* 励志句 */
  .quote{
    margin:8px 14px 4px;background:#fff;border-radius:18px;padding:12px 14px;
    box-shadow:var(--shadow);position:relative;font-size:13px;line-height:1.5;
  }
  .quote .en{color:var(--red);font-style:italic;font-weight:600;}
  .quote .cn{color:var(--ink-l);margin-top:2px;}
  .quote .cat-mini{position:absolute;right:10px;top:-16px;font-size:30px;}
  /* ===== 底部导航 ===== */
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;display:flex;
    background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(255,140,160,.25);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;font-size:11px;color:var(--ink-l);padding:6px 0;border-radius:14px;
  }
  .tab .ico{font-size:22px;line-height:1;}
  .tab.active{color:var(--red);background:var(--pink-l);}
  /* ===== 视图 ===== */
  .view{display:none;padding:10px 14px;animation:fadein .25s;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .card{
    background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(135deg,var(--pink-d),var(--red));color:#fff;
    border-radius:16px;padding:12px 18px;font-size:15px;font-weight:600;
    box-shadow:var(--shadow);transition:transform .1s;
  }
  .btn:active{transform:scale(.95);}
  .btn.ghost{background:#fff;color:var(--red);border:2px solid var(--pink-d);box-shadow:none;}
  .btn.small{padding:8px 14px;font-size:13px;border-radius:12px;}
  .btn.gray{background:#eee;color:#888;box-shadow:none;}
  /* ===== 单词卡 ===== */
  .word-card{
    background:linear-gradient(160deg,#fff 60%,var(--pink-l));
    border-radius:26px;box-shadow:var(--shadow);padding:34px 20px 24px;
    text-align:center;position:relative;overflow:hidden;margin-top:6px;
  }
  .word-card .deco{position:absolute;font-size:26px;opacity:.55;}
  .word-card .deco.d1{left:12px;top:12px;} .word-card .deco.d2{right:14px;bottom:14px;}
  .word-card .big{
    font-size:38px;font-weight:800;color:var(--ink);letter-spacing:1px;word-break:break-all;
  }
  .word-card .phon{color:var(--red);font-size:16px;margin-top:8px;min-height:20px;}
  .word-card .mean{font-size:17px;color:var(--ink);margin-top:10px;line-height:1.5;min-height:24px;}
  .word-card .speak{
    position:absolute;right:14px;top:14px;background:var(--pink-l);border-radius:50%;
    width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center;
  }
  .word-actions{display:flex;gap:10px;margin-top:14px;}
  .word-actions .btn{flex:1;padding:11px 6px;font-size:14px;}
  .more-box{
    display:none;margin-top:14px;text-align:left;background:var(--pink-bg);
    border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.7;
  }
  .more-box.show{display:block;}
  .more-box b{color:var(--red);}
  .nav-row{display:flex;gap:10px;margin-top:14px;}
  .nav-row .btn{flex:1;}
  .progress-wrap{margin:12px 4px 0;font-size:12px;color:var(--ink-l);display:flex;justify-content:space-between;}
  .pbar{height:8px;background:#fff;border-radius:6px;margin-top:4px;overflow:hidden;box-shadow:var(--shadow);}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-d),var(--red));border-radius:6px;transition:width .3s;}
  .fav-badge{position:absolute;left:16px;top:14px;font-size:24px;}
  /* ===== 导入 ===== */
  .import-area{text-align:center;}
  .import-area .icon{font-size:44px;}
  .ocr-log{font-size:12px;color:var(--ink-l);margin-top:8px;min-height:16px;}
  .edit-list{margin-top:10px;max-height:300px;overflow:auto;text-align:left;}
  .edit-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .edit-row input{border:1.5px solid var(--pink);border-radius:10px;padding:8px;font-size:13px;background:#fff;}
  .edit-row .w{flex:1.1;} .edit-row .p{flex:1;} .edit-row .m{flex:1.4;}
  .edit-row .del{background:var(--pink-l);border-radius:8px;width:30px;height:30px;font-size:14px;color:var(--red);flex:none;}
  textarea{
    width:100%;border:1.5px solid var(--pink);border-radius:14px;padding:10px;font-size:14px;
    background:#fff;min-height:90px;resize:vertical;font-family:inherit;color:var(--ink);
  }
  /* ===== 生词本 ===== */
  .fav-item{
    background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px;
    display:flex;align-items:center;gap:10px;
  }
  .fav-item .emoji{font-size:26px;}
  .fav-item .txt{flex:1;min-width:0;}
  .fav-item .fw{font-weight:700;font-size:16px;}
  .fav-item .fm{font-size:12.5px;color:var(--ink-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fav-item .acts{display:flex;gap:6px;}
  .iconbtn{background:var(--pink-l);border-radius:10px;width:36px;height:36px;font-size:16px;display:flex;align-items:center;justify-content:center;}
  /* ===== 记录 ===== */
  .rec-day{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px;}
  .rec-day .date{font-weight:700;color:var(--red);font-size:14px;}
  .rec-day .row{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--ink-l);flex-wrap:wrap;}
  /* ===== 游戏 ===== */
  .game-top{display:flex;gap:8px;margin-bottom:10px;}
  .chip{
    flex:1;background:#fff;border-radius:14px;padding:8px 6px;text-align:center;
    box-shadow:var(--shadow);font-size:12px;color:var(--ink-l);
  }
  .chip b{display:block;font-size:17px;color:var(--red);}
  .tile-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    perspective:600px;
  }
  .tile{
    background:#fff;border-radius:14px;box-shadow:var(--shadow);
    aspect-ratio:.92;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:4px;font-weight:700;position:relative;transition:transform .12s,opacity .25s;
    border:2px solid transparent;
  }
  .tile.en{font-size:15px;color:var(--ink);}
  .tile.cn{background:linear-gradient(160deg,#fff, var(--pink-l));font-size:12.5px;color:var(--ink);}
  .tile .em{font-size:24px;line-height:1;}
  .tile.sel{border-color:var(--red);transform:translateY(-4px) scale(1.04);}
  .tile.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .tile.gone{opacity:0;transform:scale(.3) rotate(10deg);pointer-events:none;}
  .tile .cat-corner{position:absolute;top:2px;left:4px;font-size:10px;}
  .game-over{
    display:none;text-align:center;padding:30px 20px;background:#fff;border-radius:22px;
    box-shadow:var(--shadow);
  }
  .game-over .big-emoji{font-size:52px;}
  .game-over h3{margin:8px 0;color:var(--red);}
  /* 弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(255,150,170,.35);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:99;padding:24px;
  }
  .modal-mask.show{display:flex;}
  .modal{
    background:#fff;border-radius:24px;padding:24px 20px;width:100%;max-width:340px;
    text-align:center;box-shadow:0 10px 40px rgba(255,100,130,.4);position:relative;
  }
  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
    background:rgba(90,61,68,.9);color:#fff;padding:9px 18px;border-radius:20px;
    font-size:13px;z-index:100;display:none;max-width:80vw;text-align:center;
  }
  .cat-face{width:46px;height:46px;flex:none;}
  .empty{text-align:center;color:var(--ink-l);font-size:13px;padding:26px 10px;line-height:1.8;}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
  <svg class="cat-face" viewBox="0 0 100 100">
    <path d="M20 38 Q14 16 30 24 Q40 28 44 34 Z" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
    <path d="M80 38 Q86 16 70 24 Q60 28 56 34 Z" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="50" cy="58" rx="34" ry="30" fill="#fff" stroke="#333" stroke-width="4"/>
    <circle cx="38" cy="54" r="3.4" fill="#333"/><circle cx="62" cy="54" r="3.4" fill="#333"/>
    <ellipse cx="50" cy="63" rx="4" ry="3" fill="#ffb830"/>
    <path d="M46 68 Q50 72 54 68" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <g stroke="#333" stroke-width="2" stroke-linecap="round">
      <line x1="10" y1="56" x2="24" y2="58"/><line x1="11" y1="66" x2="24" y2="63"/>
      <line x1="90" y1="56" x2="76" y2="58"/><line x1="89" y1="66" x2="76" y2="63"/>
    </g>
    <g transform="translate(66,26) rotate(12)">
      <path d="M0 6 Q-12 -4 -6 8 Q-10 16 0 10 Q10 16 6 8 Q12 -4 0 6Z" fill="#ff5c7a" stroke="#333" stroke-width="2"/>
      <circle cx="0" cy="7" r="2.4" fill="#ff8fab"/>
    </g>
  </svg>
  <h1>咩咩背单词 <span style="font-size:12px;color:var(--ink-l)">CET-6 加油！</span></h1>
  <div class="streak" id="streak">🔥 0天</div>
</div>

<div class="quote">
  <div class="cat-mini">🐱</div>
  <div class="en" id="qEn"></div>
  <div class="cn" id="qCn"></div>
</div>

<!-- 背单词 -->
<div class="view active" id="v-study">
  <div class="progress-wrap"><span id="stProg">今天 0 个</span><span id="stTotal">词库 0 词</span></div>
  <div class="pbar"><i id="pbar" style="width:0%"></i></div>
  <div class="word-card" id="wordCard">
    <span class="fav-badge" id="favBadge"></span>
    <span class="deco d1">🎀</span><span class="deco d2">🐟</span>
    <button class="speak" onclick="speakCurrent()">🔊</button>
    <div class="big" id="wEn">—</div>
    <div class="phon" id="wPhon"></div>
    <div class="mean" id="wMean">先去「📚导入」添加单词吧</div>
    <div class="more-box" id="moreBox"></div>
  </div>
  <div class="word-actions">
    <button class="btn ghost" id="btnFav" onclick="toggleFav()">🤍 收藏</button>
    <button class="btn ghost" onclick="toggleMore()">✨ 近义/例句</button>
  </div>
  <div class="nav-row">
    <button class="btn ghost" onclick="prevWord()">← 上一个</button>
    <button class="btn" onclick="nextWord(true)">认识啦，下一个 →</button>
  </div>
  <div style="text-align:center;margin-top:10px;">
    <button class="btn small gray" onclick="delCurrent()">🗑 删除这个词</button>
  </div>
</div>

<!-- 游戏 -->
<div class="view" id="v-game">
  <div id="gameLobby" class="card" style="text-align:center;">
    <div style="font-size:44px;">🎮</div>
    <h3 style="margin:6px 0;color:var(--red);">单词消消乐</h3>
    <p style="font-size:13px;color:var(--ink-l);line-height:1.7;">
      点一个英文，再点它的中文意思<br>配对成功就消除！用你词库里的真单词～
    </p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;">
      <button class="btn" onclick="startGame()">▶ 开始闯关</button>
      <button class="btn ghost" onclick="startGame(true)">🔁 复习生词本</button>
    </div>
  </div>
  <div id="gamePlay" style="display:none;">
    <div class="game-top">
      <div class="chip">关卡<b id="gLevel">1</b></div>
      <div class="chip">积分<b id="gScore">0</b></div>
      <div class="chip">连击<b id="gCombo">x1</b></div>
      <div class="chip">剩余<b id="gLeft">0</b></div>
    </div>
    <div class="tile-grid" id="tileGrid"></div>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn small ghost" onclick="quitGame()">← 退出本局</button>
    </div>
  </div>
  <div id="gameWin" class="game-over">
    <div class="big-emoji">🏆🐱</div>
    <h3>过关啦！太棒了！</h3>
    <p id="winInfo" style="font-size:14px;color:var(--ink-l);"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
      <button class="btn" onclick="nextLevel()">下一关 →</button>
      <button class="btn ghost" onclick="quitGame()">回大厅</button>
    </div>
  </div>
</div>

<!-- 导入 -->
<div class="view" id="v-import">
  <div class="card import-area">
    <div class="icon">📸</div>
    <h3 style="color:var(--red);margin:4px 0;">拍照 / 相册导入单词</h3>
    <p style="font-size:12.5px;color:var(--ink-l);line-height:1.6;">
      拍下单词表，我会自动识别出英文单词。<br>识别后可以修改补充音标和中文意思～
    </p>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="galleryInput" accept="image/*" style="display:none;">
    <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
      <button class="btn" onclick="document.getElementById('photoInput').click()">📷 拍照上传</button>
      <button class="btn ghost" onclick="document.getElementById('galleryInput').click()">🖼 从相册选</button>
    </div>
    <div class="ocr-log" id="ocrLog"></div>
    <div class="edit-list" id="editList"></div>
    <div id="editActions" style="display:none;margin-top:8px;">
      <button class="btn" style="width:100%;" onclick="saveImported()">💾 保存到词库</button>
    </div>
  </div>
  <div class="card">
    <h3 style="color:var(--red);font-size:15px;margin-bottom:8px;">✏️ 或者打字粘贴</h3>
    <textarea id="pasteArea" placeholder="每行一个词，例如：&#10;abandon 放弃&#10;ambiguous 模棱两可的"></textarea>
    <button class="btn" style="width:100%;margin-top:10px;" onclick="importPaste()">📥 导入这些词</button>
  </div>
</div>

<!-- 生词本 -->
<div class="view" id="v-fav">
  <div class="card">
    <h3 style="color:var(--red);">⭐ 我的生词本 <span id="favCount" style="font-size:13px;color:var(--ink-l);font-weight:normal;"></span></h3>
    <div id="favList" style="margin-top:10px;"></div>
  </div>
</div>

<!-- 记录 -->
<div class="view" id="v-rec">
  <div class="card">
    <h3 style="color:var(--red);">📅 每日记录</h3>
    <div id="recList" style="margin-top:10px;"></div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tabbar">
  <button class="tab active" data-v="study" onclick="switchTab('study')"><span class="ico">📖</span>背单词</button>
  <button class="tab" data-v="game" onclick="switchTab('game')"><span class="ico">🎮</span>消消乐</button>
  <button class="tab" data-v="import" onclick="switchTab('import')"><span class="ico">📚</span>导入</button>
  <button class="tab" data-v="fav" onclick="switchTab('fav')"><span class="ico">⭐</span>生词本</button>
  <button class="tab" data-v="rec" onclick="switchTab('rec')"><span class="ico">📅</span>记录</button>
</div>

<!-- 欢迎弹窗 -->
<div class="modal-mask" id="welcomeMask">
  <div class="modal">
    <div style="font-size:50px;">🐱💕</div>
    <h3 style="color:var(--red);margin:6px 0;">欢迎回来，小美！</h3>
    <p id="wQuoteEn" style="font-style:italic;color:var(--red);font-weight:600;font-size:14px;margin-top:10px;line-height:1.5;"></p>
    <p id="wQuoteCn" style="font-size:13px;color:var(--ink-l);margin-top:4px;"></p>
    <button class="btn" style="width:100%;margin-top:18px;" onclick="closeWelcome()">今天也要加油鸭 →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 图案映射：必须在 DB 初始化之前，避免 const 暂时性死区 ===== */
const EMOJI_MAP=[["火","🔥"],["燃","🔥"],["水","💧"],["海","🌊"],["雨","🌧"],["雪","❄️"],["云","☁️"],["星","⭐"],["太阳","☀️"],["月光","🌙"],["暗","🌙"],["花","🌸"],["树","🌳"],["草","🌿"],["猫","🐱"],["狗","🐶"],["鸟","🐦"],["鱼","🐟"],["笑","😄"],["乐","😊"],["喜","😊"],["悲","😢"],["哭","😭"],["怒","😠"],["怕","😨"],["爱","❤️"],["心","💗"],["恨","💔"],["跑","🏃"],["走","🚶"],["跳","🤸"],["吃","🍽"],["喝","🥤"],["睡","😴"],["书","📖"],["学","📚"],["教","🧑‍🏫"],["字","🔤"],["话","💬"],["问","❓"],["答","✅"],["想","💡"],["计划","📝"],["会议","📅"],["工作","💼"],["钱","💰"],["财","💰"],["买","🛒"],["卖","🏷"],["市","🏬"],["家","🏠"],["房","🏠"],["城","🏙"],["国","🌏"],["世界","🌍"],["旅行","✈️"],["车","🚗"],["路","🛣"],["时间","⏰"],["日","📅"],["年","📆"],["王","👑"],["战胜","🏆"],["胜利","🏆"],["失败","💦"],["律","⚖️"],["法","⚖️"],["罪","🚔"],["战","⚔️"],["和","🕊"],["医","💊"],["药","💊"],["病","🤒"],["生命","🌱"],["死","💀"],["眼","👁"],["手","✋"],["头","🧠"],["脑","🧠"],["食","🍎"],["肉","🍖"],["音","🎵"],["歌","🎶"],["画","🎨"],["色","🎨"],["数","🔢"],["科","🔬"],["电","⚡"],["光","💡"],["热","🥵"],["冷","🥶"],["大","🐘"],["小","🐜"],["快","⚡"],["慢","🐢"],["好","👍"],["坏","👎"],["新","🆕"],["旧","🕰"],["领导","🧭"],["团队","🤝"],["朋友","🫂"],["电话","📱"],["电脑","💻"],["网络","🌐"],["信","✉️"],["礼","🎁"],["衣","👕"],["运动","⚽"],["游戏","🎮"],["成","🎯"],["目标","🎯"],["努力","💪"],["健康","💪"],["祝","🎉"],["庆祝","🎉"]];

/* ================= 数据 ================= */
const KEY='catwords_v1';
let DB=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.words)return d;}catch(e){}
  return {words:seedWords(),log:{},game:{level:1,points:0,best:0}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function guessEmoji(word,mean){
  const s=(mean||'')+(word||'');
  for(const [k,v] of EMOJI_MAP){if(s.includes(k))return v;}
  return '📖';
}
function esc(s){return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let curIdx=0;
function sortWords(){
  // 生词本优先，然后学习次数少的在前
  DB.words.sort((a,b)=>{
    if(a.fav!==b.fav)return a.fav?-1:1;
    if((a.study||0)!==(b.study||0))return (a.study||0)-(b.study||0);
    return (a.lastSeen||0)-(b.lastSeen||0);
  });
}
function renderStudyTop(){
  const t=today();const l=DB.log[t]||{};
  document.getElementById('stProg').textContent='今天背了 '+(l.studied||0)+' 个';
  document.getElementById('stTotal').textContent='词库 '+DB.words.length+' 词 · 生词 '+DB.words.filter(w=>w.fav).length+' 个';
  const goal=20,p=Math.min(100,Math.round((l.studied||0)/goal*100));
  document.getElementById('pbar').style.width=p+'%';
  // streak
  let streak=0;const d=new Date();
  for(let i=0;i<365;i++){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(DB.log[k]&&((DB.log[k].studied||0)>0||(DB.log[k].game||0)>0))streak++;
    else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  document.getElementById('streak').textContent='🔥 '+streak+'天';
}
function renderStudy(){
  sortWords();
  renderStudyTop();
  if(curIdx>=DB.words.length)curIdx=0;

function nextWord(count){

    if(count){DB.words[curIdx].study=(DB.words[curIdx].study||0)+1;logInc('studied');}
    DB.words[curIdx].lastSeen=Date.now();save();
  }
  curIdx=(curIdx+1)%Math.max(1,DB.words.length);

function toggleMore(){
  const box=document.getElementById('moreBox');
  if(box.classList.contains('show')){box.classList.remove('show');return;}
  const w=DB.words[curIdx];if(!w)return;
  box.innerHTML='<b>⏳ 正在为你查近义词和例句…</b>';
  box.classList.add('show');
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.word))
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{
      let html='';
      const e=d[0];
      if(e.phonetic&&!w.phon){w.phon=e.phonetic;save();document.getElementById('wPhon').textContent=w.phon;}
      let audio=e.phonetics&&e.phonetics.find(p=>p.audio);
      (d.slice(0,2)).forEach(entry=>{
        entry.meanings.slice(0,2).forEach(m=>{
          html+='<b>'+m.partOfSpeech+'.</b> ';
          if(m.synonyms&&m.synonyms.length)html+='近义词：'+m.synonyms.slice(0,4).join(', ')+'<br>';
          const ex=m.definitions.find(x=>x.example);
          if(ex)html+='例句：'+esc(ex.example)+'<br>';
          else if(m.definitions[0])html+=esc(m.definitions[0].definition)+'<br>';
          html+='<br>';
        });
      });
      box.innerHTML=html||'<b>这个词太害羞了，没查到内容 >_<</b>';
      if(audio&&!window._catAudio){window._catAudio=new Audio();}
      if(audio)window._catAudio.src=audio.audio;
    })
    .catch(()=>{box.innerHTML='<b>没查到诶 (可能断网了)</b><br>你也可以自己在导入页给这个词补充内容哦～';});
}

function speak(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.85;
    const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakCurrent(){const w=DB.words[curIdx];if(w)speak(w.word);}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{};}
/* ================= 音标获取 ================= */
async function fetchPhonetic(w){
  if(w.phon||w._phonTried)return;
  w._phonTried=true;
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.word));
    if(!r.ok)return;
    const d=await r.json();
    const p=d[0].phonetic||(d[0].phonetics&&d[0].phonetics.find(x=>x.text)&&d[0].phonetics.find(x=>x.text).text);
    if(p){w.phon=p;save();if(DB.words[curIdx]===w)document.getElementById('wPhon').textContent=p;}
  }catch(e){}
}

let pendingRows=[];
/* OCR 引擎全部本地化，不依赖国外 CDN */
const TESS_BASE=new URL('tess/',document.baseURI).href;
let tessLoading=null;
function supportsSIMD(){
  try{
    const b=new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,26,11]);
    return WebAssembly.validate(b);
  }catch(e){return false;}
}
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=TESS_BASE+'tesseract.min.js';
    s.onload=()=>res();
    s.onerror=()=>{tessLoading=null;rej(new Error('load fail'));};
    document.head.appendChild(s);
  });
  return tessLoading;
}
function ocrImage(file){
  const log=document.getElementById('ocrLog');
  log.textContent='🐱 正在加载识别引擎…';
  loadTesseract().then(()=>doOCR(file,log)).catch(()=>{
    log.textContent='识别引擎加载失败，检查一下网络？也可以用下面的打字粘贴导入哦～';
  });
}
async function doOCR(file,log){
  try{
    log.textContent='🐱 正在加载识别引擎…';
    /* corePath 必须传目录（worker 会自己检测 SIMD 并拼内核文件名）；
       传具体文件名会导致二次拼接 404 —— 这是之前拍照一直没反应的根因 */
    const opts={
      workerPath:TESS_BASE+'worker.min.js',
      corePath:TESS_BASE,
      langPath:TESS_BASE+'lang',
      workerBlobURL:false,
      logger:m=>{
        const s=m.status||'';
        if(s.indexOf('tesseract core')>=0)log.textContent='🐱 加载识别内核…';
        else if(s.indexOf('language traineddata')>=0)log.textContent='🐱 加载语言包…';
        else if(s.indexOf('initializing api')>=0)log.textContent='🐱 初始化引擎…';
        else if(s==='recognizing text')log.textContent='🐱 识别中… '+Math.round(m.progress*100)+'%';
      }
    };
    const job=Tesseract.recognize(file,'eng',opts);
    const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error('识别超时')),60000));
    const ret=await Promise.race([job,timer]);
    parseOcrText(ret.data.text);
    if(!pendingRows.length){
      log.textContent='⚠️ 没认出英文单词，拍得更清楚些试试；也可以直接用下面「打字粘贴」，一样能背～';
    }else{
      log.textContent='✅ 识别完成！检查一下下面的词，改好意思再保存～';
    }
  }catch(e){
    console.error('OCR error',e);
    log.textContent='⚠️ 识别失败（'+String(e&&e.message||e).slice(0,40)+'）。别急，下面「打字粘贴」也能导入单词～';
    const ta=document.getElementById('pasteArea');if(ta)ta.focus();
  }
}
function parseOcrText(text){
  pendingRows=[];
  const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  lines.forEach(line=>{
    const m=line.match(/[A-Za-z][A-Za-z'\-]+/);
    if(!m)return;
    const word=m[0].toLowerCase();
    if(word.length<2)return;
    let rest=line.replace(m[0],'').replace(/[\/\[\]]+/g,'').trim();
    pendingRows.push({word,phon:'',mean:rest});
  });
  renderEditList();
}
function renderEditList(){
  const box=document.getElementById('editList');
  box.innerHTML='';
  pendingRows.forEach((r,i)=>{
    const row=document.createElement('div');row.className='edit-row';
    row.innerHTML=`<input class="w" value="${esc(r.word)}" placeholder="单词">
      <input class="p" value="${esc(r.phon)}" placeholder="音标(可空)">
      <input class="m" value="${esc(r.mean)}" placeholder="中文意思">
      <button class="del">✕</button>`;
    row.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{r.word=row.children[0].value;r.phon=row.children[1].value;r.mean=row.children[2].value;});
    row.querySelector('.del').onclick=()=>{pendingRows.splice(i,1);renderEditList();};
    box.appendChild(row);
  });
  document.getElementById('editActions').style.display=pendingRows.length?'block':'none';
}
function saveImported(){
  let n=0;
  pendingRows.forEach(r=>{
    if(!r.word.trim())return;
    if(DB.words.some(w=>w.word===r.word.trim().toLowerCase()))return;
    DB.words.push({id:'w'+Date.now()+Math.random().toString(36).slice(2,6),word:r.word.trim().toLowerCase(),phon:r.phon.trim(),mean:r.mean.trim(),emoji:guessEmoji(r.word,r.mean),fav:false,added:today(),study:0});
    n++;
  });
  save();
  pendingRows=[];renderEditList();
  document.getElementById('ocrLog').textContent='🎉 已加入 '+n+' 个新单词！去背单词页看看吧';
  logInc('added',n);
  toast('已加入 '+n+' 个新单词 🎉');
}

/* ================= 游戏：单词消消乐 ================= */
let G=null;
function startGame(favOnly=false){
  let pool=favOnly?DB.words.filter(w=>w.fav):DB.words;
  if(favOnly&&pool.length<4){toast('生词本里词太少啦，先用全部词库玩吧');pool=DB.words;}
  if(pool.length<4){toast('词库里至少要有 4 个单词才能玩哦');return;}
  const level=DB.game.level||1;
  const pairs=Math.min(pool.length,Math.min(4+level,10));
  const chosen=shuffle([...pool]).slice(0,pairs);
  let tiles=[];
  chosen.forEach((w,i)=>{
    tiles.push({key:w.word,type:'en',label:w.word,emoji:'',wid:w.id});
    tiles.push({key:w.word,type:'cn',label:w.mean||'(无意思)',emoji:w.emoji||guessEmoji(w.word,w.mean),wid:w.id});
  });
  tiles=shuffle(tiles);
  G={tiles,score:0,combo:0,sel:null,level,favOnly};
  document.getElementById('gameLobby').style.display='none';
  document.getElementById('gameWin').style.display='none';
  document.getElementById('gamePlay').style.display='block';
  document.getElementById('gLevel').textContent=level;
  updateGameHud();
  renderTiles();
}
function nextLevel(){DB.game.level=(DB.game.level||1)+1;save();startGame(G?G.favOnly:false);}
function quitGame(){
  document.getElementById('gamePlay').style.display='none';
  document.getElementById('gameWin').style.display='none';
  document.getElementById('gameLobby').style.display='block';
  G=null;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderTiles(){
  const grid=document.getElementById('tileGrid');
  grid.innerHTML='';
  G.tiles.forEach((t,i)=>{
    if(t.removed)return;
    const d=document.createElement('div');
    d.className='tile '+(t.type==='en'?'en':'cn');
    d.innerHTML=(t.type==='cn'?'<span class="em">'+t.emoji+'</span>':'<span class="cat-corner">🐾</span>')+'<span>'+esc(t.label)+'</span>';
    d.onclick=()=>tapTile(i,d);
    grid.appendChild(d);
  });
}
function tapTile(i,el){
  const t=G.tiles[i];
  if(t.removed)return;
  speak(t.type==='en'?t.label:'');
  if(!G.sel){G.sel={i,el};el.classList.add('sel');return;}
  if(G.sel.i===i){el.classList.remove('sel');G.sel=null;return;}
  const a=G.tiles[G.sel.i],b=t;
  if(a.key===b.key&&a.type!==b.type){
    // match!
    a.removed=b.removed=true;
    G.sel.el.classList.remove('sel');
    G.sel.el.classList.add('gone');el.classList.add('gone');
    G.combo++;
    const gain=10+(G.combo-1)*5;
    G.score+=gain;
    updateGameHud();
    toast('✨ 配对成功 +'+gain+(G.combo>1?'（连击x'+G.combo+'）':''));
    if(G.tiles.every(x=>x.removed))winGame();
  }else{
    el.classList.add('shake');
    G.sel.el.classList.remove('sel');
    setTimeout(()=>el.classList.remove('shake'),320);
    G.combo=0;updateGameHud();
  }
  G.sel=null;
}
function updateGameHud(){
  document.getElementById('gScore').textContent=G.score;
  document.getElementById('gCombo').textContent='x'+Math.max(1,G.combo);
  document.getElementById('gLeft').textContent=G.tiles.filter(t=>!t.removed).length/2;
}
function winGame(){
  const bonus=20;
  G.score+=bonus;
  DB.game.points=(DB.game.points||0)+G.score;
  DB.game.best=Math.max(DB.game.best||0,G.score);
  save();
  logInc('game',G.score);
  document.getElementById('winInfo').innerHTML='本局得分 <b style="color:var(--red);">'+G.score+'</b>（含通关奖励 +'+bonus+'）<br>历史总积分 '+DB.game.points+' · 最高关卡 '+(DB.game.level)+'';
  setTimeout(()=>{
    document.getElementById('gamePlay').style.display='none';
    document.getElementById('gameWin').style.display='block';
  },400);
}
/* ================= 启动 ================= */
showQuote();
renderStudy();
renderRecords();
document.getElementById('welcomeMask').classList.add('show');
</script>
</body>
