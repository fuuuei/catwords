<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="咩咩跟读">
<title>咩咩跟读 · 拍照朗读</title>
<style>
:root{
  --pink:#ff6fa5;
  --pink-deep:#f4508c;
  --pink-soft:#ffe3ee;
  --pink-line:#ffd0e2;
  --ink:#463039;
  --ink-soft:#8a6f7b;
  --card:#ffffff;
  --shadow:0 8px 24px rgba(255,111,165,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(170deg,#ffe7f1 0%,#fff7fa 38%,#ffeef6 70%,#ffe6f0 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:calc(112px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}

/* 顶部 */
.hero{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cat{
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(145deg,#ffd3e4,#ffb3cf);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex:0 0 auto;
  box-shadow:0 6px 16px rgba(255,111,165,.28);
  position:relative;
}
.cat::after{
  content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff,#ff8db8);box-shadow:0 0 0 2px #fff;
}
.hero h1{font-size:20px;margin:0;letter-spacing:.5px}
.hero p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft)}

/* 卡片 */
.card{
  background:var(--card);border-radius:20px;padding:16px;
  box-shadow:var(--shadow);margin-bottom:14px;
  border:1px solid rgba(255,208,226,.7);
}
.card-title{font-size:13px;color:var(--ink-soft);margin:0 0 12px;display:flex;align-items:center;gap:6px}
.card-title b{color:var(--pink-deep);font-size:15px}

/* 拍照按钮 */
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  border:none;border-radius:16px;padding:20px 10px;font-size:15px;font-weight:700;
  font-family:inherit;color:#fff;cursor:pointer;
  background:linear-gradient(145deg,#ff8ab6,#f4508c);
  box-shadow:0 8px 18px rgba(244,80,140,.28);
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.btn .ico{font-size:26px;line-height:1}
.btn:active{transform:scale(.965);box-shadow:0 4px 10px rgba(244,80,140,.24)}
.btn.ghost{
  background:#fff;color:var(--pink-deep);
  border:2px solid var(--pink-line);box-shadow:0 6px 14px rgba(255,111,165,.10);
}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;margin:12px 0 0;line-height:1.7}

/* 状态 */
.status{display:none;margin-top:14px}
.status.on{display:block}
.status-text{font-size:13px;color:var(--pink-deep);margin-bottom:8px;text-align:center;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--pink-soft);overflow:hidden}
.bar > i{
  display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#ffb3d0,#f4508c);
  transition:width .25s ease;
}

/* 文本区 */
textarea{
  width:100%;min-height:104px;resize:vertical;border-radius:14px;
  border:1.5px solid var(--pink-line);background:#fffafc;
  padding:12px;font-size:14px;line-height:1.6;color:var(--ink);
  font-family:inherit;outline:none;
}
textarea:focus{border-color:var(--pink);background:#fff}
.row-actions{display:flex;gap:10px;margin-top:10px}
.mini{
  flex:1;border:none;border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;
  font-family:inherit;cursor:pointer;background:var(--pink-soft);color:var(--pink-deep);
  transition:transform .12s ease;
}
.mini:active{transform:scale(.97)}
.mini.solid{background:linear-gradient(145deg,#ff8ab6,#f4508c);color:#fff;box-shadow:0 6px 14px rgba(244,80,140,.22)}

/* 单词列表 */
.list-head{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 10px}
.list-head span:first-child{font-size:13px;color:var(--ink-soft)}
.count{font-size:13px;color:var(--pink-deep);font-weight:800}
.wrow{
  display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:16px;padding:13px 14px;margin-bottom:9px;
  border:2px solid transparent;
  box-shadow:0 4px 14px rgba(255,111,165,.10);
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.wrow.active{
  border-color:var(--pink);
  background:linear-gradient(135deg,#fff2f7,#ffe4ef);
  transform:scale(1.02);
  box-shadow:0 8px 20px rgba(244,80,140,.18);
}
.num{font-size:11.5px;color:#d3b3c1;width:22px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.wd{
  flex:1;font-size:22px;font-weight:700;letter-spacing:.3px;color:#3d2c34;
  font-family:Georgia,"Times New Roman",serif;word-break:break-word;
}
.wrow.active .wd{color:var(--pink-deep)}
.spk{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:var(--pink-soft);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,background .12s ease;
}
.spk:active{transform:scale(.9);background:#ffd0e2}

.empty{
  text-align:center;padding:28px 10px;color:var(--ink-soft);font-size:13px;line-height:2;
}
.empty .big{font-size:38px;display:block;margin-bottom:6px}

/* 底部播放条 */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--pink-line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(255,111,165,.14);
}
.progress-line{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;font-variant-numeric:tabular-nums}
.progress-line b{color:var(--pink-deep)}
.controls{display:flex;align-items:center;justify-content:center;gap:14px}
.ctrl{
  border:none;background:var(--pink-soft);color:var(--pink-deep);
  width:52px;height:52px;border-radius:50%;font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease;
}
.ctrl:active{transform:scale(.9)}
.play{
  width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,#ff8ab6,#f4508c);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(244,80,140,.34);
  transition:transform .12s ease;
}
.play:active{transform:scale(.93)}
.rate{
  position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));
  border:none;background:#fff;color:var(--pink-deep);border:1.5px solid var(--pink-line);
  border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:800;
  cursor:pointer;font-family:inherit;
}
.controls{position:relative}
.controls .spacer{width:52px;height:52px;flex:0 0 auto}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="cat">🐱</div>
    <div>
      <h1>咩咩跟读</h1>
      <p>拍照 → 一键转文字 → 逐个单词朗读</p>
    </div>
  </div>

  <!-- 拍摄 -->
  <div class="card">
    <p class="card-title">📷 <b>第一步</b>　拍下你要读的单词</p>
    <div class="shoot">
      <button class="btn" id="btnCam"><span class="ico">📷</span>拍照</button>
      <button class="btn ghost" id="btnLib"><span class="ico">🖼</span>从相册选</button>
    </div>
    <p class="hint">拍课本 / 单词表 / 试卷都行，识别完全自动</p>
    <div class="status" id="status">
      <div class="status-text" id="statusText">准备中…</div>
      <div class="bar"><i id="statusBar"></i></div>
    </div>
  </div>

  <!-- 文本 -->
  <div class="card" id="textCard" style="display:none">
    <p class="card-title">📝 <b>第二步</b>　识别结果（可直接改）</p>
    <textarea id="ta" placeholder="这里会显示识别出来的英文…" spellcheck="false"></textarea>
    <div class="row-actions">
      <button class="mini solid" id="btnSplit">重新拆分单词</button>
      <button class="mini" id="btnClear">清空</button>
    </div>
  </div>

  <!-- 列表 -->
  <div id="listCard" style="display:none">
    <div class="list-head">
      <span>点单词单独听，或按底部 ▶ 连读</span>
      <span class="count" id="count">0 个词</span>
    </div>
    <div id="list"></div>
  </div>

  <div class="empty" id="emptyTip">
    <span class="big">🐾</span>
    还没有单词哦<br>先拍一张吧～
  </div>
</div>

<!-- 播放条 -->
<div class="player" id="player" style="display:none">
  <div class="progress-line" id="progressLine">第 <b>0</b> / 0 个</div>
  <div class="controls">
    <button class="ctrl" id="btnPrev" aria-label="上一个">‹</button>
    <button class="play" id="btnPlay" aria-label="播放">▶</button>
    <button class="ctrl" id="btnNext" aria-label="下一个">›</button>
    <button class="rate" id="btnRate">1.0x</button>
  </div>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none">
<input type="file" id="libIn" accept="image/*" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none">

<script>
/* ================= 基础 ================= */
const $ = function(id){ return document.getElementById(id); };
const TESS_BASE = new URL('tess/', document.baseURI).href;

let words = [];          // 单词数组
let curIdx = -1;         // 当前朗读位置
let playing = false;     // 连读中
let ended = false;       // 连读到尾部
let rate = 1;            // 语速
let voices = [];         // 英文语音
let tessLoading = null;  // 引擎加载 promise
let lastText = '';

/* ================= 语音 ================= */
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = window.speechSynthesis.getVoices() || [];
  voices = all.filter(function(v){ return /^en/i.test(v.lang || v.language || ''); });
}
loadVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function pickVoice(){
  if(!voices.length) loadVoices();
  if(!voices.length) return null;
  const prefer = ['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Daniel','Alex'];
  for(let i=0;i<prefer.length;i++){
    for(let j=0;j<voices.length;j++){
      if((voices[j].name||'').indexOf(prefer[i])>=0) return voices[j];
    }
  }
  for(let j=0;j<voices.length;j++){
    if(/en[-_]US/i.test(voices[j].lang||'')) return voices[j];
  }
  return voices[0];
}
function speak(text){
  return new Promise(function(resolve){
    if(!('speechSynthesis' in window) || !text){ resolve(); return; }
    try{ window.speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate;
    u.pitch = 1;
    const v = pickVoice();
    if(v) u.voice = v;
    let done = false;
    const fin = function(){ if(done) return; done = true; resolve(); };
    u.onend = fin;
    u.onerror = fin;
    const guard = Math.max(4000, 1500 + text.length * 500 / rate);
    setTimeout(fin, guard);
    window.speechSynthesis.speak(u);
  });
}
function stopSpeech(){
  try{ window.speechSynthesis.cancel(); }catch(e){}
}

/* ================= 渲染 ================= */
function renderList(){
  const list = $('list');
  const card = $('listCard');
  const emptyTip = $('emptyTip');
  const player = $('player');
  list.innerHTML = '';
  $('count').textContent = words.length + ' 个词';

  if(!words.length){
    card.style.display = 'none';
    player.style.display = 'none';
    emptyTip.style.display = 'block';
    return;
  }
  emptyTip.style.display = 'none';
  card.style.display = 'block';
  player.style.display = 'block';

  const frag = document.createDocumentFragment();
  words.forEach(function(w, i){
    const row = document.createElement('div');
    row.className = 'wrow';
    row.dataset.i = String(i);

    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = String(i + 1);

    const t = document.createElement('span');
    t.className = 'wd';
    t.textContent = w;

    const b = document.createElement('button');
    b.className = 'spk';
    b.type = 'button';
    b.textContent = '🔊';
    b.setAttribute('aria-label', '朗读 ' + w);

    row.appendChild(n);
    row.appendChild(t);
    row.appendChild(b);

    row.addEventListener('click', function(ev){
      if(ev.target && ev.target.classList.contains('spk')) return; // 按钮自己处理
      stopAndJump(i);
    });
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      stopAndJump(i);
    });

    frag.appendChild(row);
  });
  list.appendChild(frag);
  updatePlayer();
}
function highlight(i){
  const rows = document.querySelectorAll('.wrow');
  for(let k=0;k<rows.length;k++){
    if(k === i) rows[k].classList.add('active');
    else rows[k].classList.remove('active');
  }
  if(i >= 0 && rows[i]){
    const r = rows[i];
    const top = r.getBoundingClientRect().top + window.pageYOffset;
    const vh = window.innerHeight;
    const barH = 120;
    if(r.getBoundingClientRect().top < 90 || r.getBoundingClientRect().bottom > vh - barH){
      window.scrollTo({ top: top - vh * 0.38, behavior: 'smooth' });
    }
  }
}
function updatePlayer(){
  $('btnPlay').textContent = playing ? '❚❚' : '▶';
  const total = words.length;
  const now = curIdx >= 0 ? (curIdx + 1) : 0;
  $('progressLine').innerHTML = '第 <b>' + now + '</b> / ' + total + ' 个';
}

/* ================= 连读 ================= */
async function playSeq(){
  if(!words.length) return;
  if(ended || curIdx >= words.length){
    curIdx = 0;
    ended = false;
  }
  playing = true;
  updatePlayer();
  while(playing && curIdx < words.length){
    highlight(curIdx);
    updatePlayer();
    const w = words[curIdx];
    await speak(w);
    if(!playing) break;
    curIdx++;
    if(curIdx >= words.length){
      playing = false;
      ended = true;
      curIdx = words.length - 1;
      highlight(curIdx);
      updatePlayer();
      break;
    }
  }
}
function stopAll(){
  playing = false;
  stopSpeech();
  updatePlayer();
}
function stopAndJump(i){
  playing = false;
  stopSpeech();
  ended = false;
  curIdx = i;
  highlight(i);
  updatePlayer();
  speak(words[i]);
}
function step(delta){
  if(!words.length) return;
  playing = false;
  stopSpeech();
  ended = false;
  let i = curIdx < 0 ? 0 : curIdx + delta;
  if(i < 0) i = 0;
  if(i > words.length - 1) i = words.length - 1;
  curIdx = i;
  highlight(i);
  updatePlayer();
  speak(words[i]);
}

/* ================= 拆词 ================= */
function splitWords(text){
  const cleaned = String(text || '').replace(/[^A-Za-z'\u2019\-]+/g, ' ');
  const raw = cleaned.split(/\s+/);
  const out = [];
  const seen = {};
  for(let i=0;i<raw.length;i++){
    let w = raw[i].replace(/^[-'\u2019]+/, '').replace(/[-'\u2019]+$/, '');
    if(!/[A-Za-z]/.test(w)) continue;
    if(w.length === 1 && !/^[aiAI]$/.test(w)) continue;
    if(w.length > 30) continue;
    const k = w.toLowerCase();
    if(seen[k]) continue;
    seen[k] = 1;
    out.push(w);
  }
  return out;
}
function applyText(){
  const t = $('ta').value || '';
  lastText = t;
  words = splitWords(t);
  curIdx = -1;
  ended = false;
  playing = false;
  stopSpeech();
  renderList();
  highlight(-1);
  if(words.length){
    $('textCard').style.display = 'block';
  }
}

/* ================= OCR ================= */
function setStatus(txt, pct){
  const box = $('status');
  box.classList.add('on');
  $('statusText').textContent = txt;
  if(typeof pct === 'number'){
    $('statusBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
}
function hideStatus(){
  $('status').classList.remove('on');
  $('statusBar').style.width = '0%';
}
function supportsSIMD(){
  try{
    const b = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,26,11]);
    return WebAssembly.validate(b);
  }catch(e){ return false; }
}
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoading) return tessLoading;
  tessLoading = new Promise(function(res, rej){
    const s = document.createElement('script');
    s.src = TESS_BASE + 'tesseract.min.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ tessLoading = null; rej(new Error('引擎加载失败')); };
    document.head.appendChild(s);
  });
  return tessLoading;
}
function downscale(file, maxSide){
  return new Promise(function(resolve){
    let img;
    try{ img = new Image(); }catch(e){ resolve(file); return; }
    const url = URL.createObjectURL(file);
    img.onload = function(){
      try{
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        if(scale >= 1){ URL.revokeObjectURL(url); resolve(file); return; }
        const c = document.createElement('canvas');
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){
          URL.revokeObjectURL(url);
          resolve(b || file);
        }, 'image/jpeg', 0.92);
      }catch(e){
        URL.revokeObjectURL(url);
        resolve(file);
      }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function handleFile(file){
  if(!file) return;
  setStatus('🐱 正在准备…', 3);
  try{
    const small = await downscale(file, 1700);
    setStatus('🐱 加载识别引擎…', 6);
    await loadTesseract();

    const opts = {
      workerPath: TESS_BASE + 'worker.min.js',
      corePath: TESS_BASE,          /* 必须传目录：worker 自己拼内核文件名 */
      langPath: TESS_BASE + 'lang',
      workerBlobURL: false,
      logger: function(m){
        const s = m.status || '';
        if(s.indexOf('loading tesseract core') >= 0) setStatus('🐱 加载识别内核…', 15);
        else if(s.indexOf('loaded tesseract core') >= 0) setStatus('🐱 内核就绪…', 26);
        else if(s.indexOf('loading language traineddata') >= 0) setStatus('🐱 加载语言包…', 30 + Math.round((m.progress || 0) * 22));
        else if(s.indexOf('loaded language traineddata') >= 0) setStatus('🐱 语言包就绪…', 54);
        else if(s.indexOf('initializing api') >= 0) setStatus('🐱 初始化引擎…', 58);
        else if(s === 'recognizing text') setStatus('🐱 识别中… ' + Math.round((m.progress || 0) * 100) + '%', 60 + Math.round((m.progress || 0) * 40));
      }
    };
    const job = Tesseract.recognize(small, 'eng', opts);
    const timeout = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('识别超时')); }, 90000); });
    const ret = await Promise.race([job, timeout]);

    const text = (ret && ret.data && ret.data.text) ? ret.data.text : '';
    $('ta').value = text;
    $('textCard').style.display = 'block';
    applyText();

    if(!words.length){
      setStatus('⚠️ 没认出英文单词，拍清楚一点再试', 100);
      setTimeout(hideStatus, 2600);
    }else{
      setStatus('✅ 识别完成，共 ' + words.length + ' 个单词', 100);
      setTimeout(hideStatus, 1600);
      window.scrollTo({ top: $('listCard').offsetTop - 70, behavior: 'smooth' });
    }
  }catch(e){
    console.error('OCR error', e);
    setStatus('⚠️ 识别失败：' + String((e && e.message) || e).slice(0, 40), 100);
    setTimeout(hideStatus, 3000);
    $('textCard').style.display = 'block';
    $('ta').focus();
  }
}

/* ================= 事件 ================= */
$('btnCam').addEventListener('click', function(){ $('camIn').click(); });
$('btnLib').addEventListener('click', function(){ $('libIn').click(); });

function bindInput(el){
  el.addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(f) handleFile(f);
  });
}
bindInput($('camIn'));
bindInput($('libIn'));

$('btnSplit').addEventListener('click', function(){
  applyText();
  if(!words.length){
    $('count').textContent = '0 个词';
    alert('没找到英文单词，检查一下文本框里的内容～');
  }
});
$('btnClear').addEventListener('click', function(){
  stopAll();
  $('ta').value = '';
  words = [];
  curIdx = -1;
  ended = false;
  renderList();
  $('textCard').style.display = 'none';
});

$('btnPlay').addEventListener('click', function(){
  if(!words.length) return;
  if(playing){ stopAll(); }
  else { playSeq(); }
});
$('btnPrev').addEventListener('click', function(){ step(-1); });
$('btnNext').addEventListener('click', function(){ step(1); });

const RATES = [1, 0.7, 0.85, 1.15];
let rateIdx = 0;
$('btnRate').addEventListener('click', function(){
  rateIdx = (rateIdx + 1) % RATES.length;
  rate = RATES[rateIdx];
  $('btnRate').textContent = rate.toFixed(2).replace(/0$/, '') + 'x';
  if(playing){ stopAll(); playSeq(); }
});

/* 页面切走时停掉声音，避免后台乱读 */
document.addEventListener('visibilitychange', function(){
  if(document.hidden) stopAll();
});

/* 初始状态 */
renderList();
</script>
</body>
</html>
